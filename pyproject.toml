[project]
name = "liveoption"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "requests>=2.32.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "anthropic>=0.34.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
liveoption = "trading.app:main"

[tool.setuptools.packages.find]
include = ["trading*", "liveoption_web*"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]
web-dev = ["pytest-asyncio>=0.23", "pytest-httpx>=0.30"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["slow: long-running integration checks"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
