# Intraday SPY 2025 Q1 — intraday LLM strategy. Web-launcher-managed scenario.
# Adding a new scenario: commit the YAML here AND add an entry in
# liveoption_web/runs/catalog.py (same PR).
experiment:
  run_id: intraday_spy_2025_q1
  seed: 42
  mode: replay
  start: "2025-01-02"
  end: "2025-03-31"
  universe: ["SPY"]
  frequency: "1m"
  timezone: America/New_York
  initial_cash: 100000.0

strategy:
  name: intraday_llm
  params:
    decision_interval_minutes: 15
    llm_provider: deepseek
    llm_model: deepseek-chat
    dte_min: 0
    dte_max: 7
    max_positions: 5

risk:
  max_exposure_pct: 0.5
  max_daily_loss_pct: 0.02
  circuit_breaker_loss_pct: 0.03
  flatten_before_close: true
  flatten_minutes_before_close: 5
  max_orders_per_day: 20
  max_position_per_symbol: 100

# execution.pmb_base_url / upq_base_url intentionally unset: they resolve via
# trading/core/endpoints.py (QFinZero hub by default; override with QFZ_HUB_URL,
# QFZ_PMB_URL, QFZ_UPQ_URL — e.g. on hosts that run standalone services).

data_policy:
  news_enabled: true
  news_lookback_days: 3
  max_stale_minutes: 10
  chain_filter_dte_min: 0
  chain_filter_dte_max: 7
  chain_filter_delta_min: 0.20
  chain_filter_delta_max: 0.60

evaluation:
  output_dir: "./output/web/intraday_spy_2025_q1"
