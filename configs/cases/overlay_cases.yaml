# Overlay experiment cases — each entry runs as an independent experiment.
# Output: ./output/{model}/overlay/{ticker}/{mode}/

# Risk settings applied to every case in this file.
# circuit_breaker_loss_pct: daily loss threshold that blocks all trading for the day.
# max_daily_loss_pct: hard stop — no trades if daily loss exceeds this fraction.
risk_overrides:
  circuit_breaker_loss_pct: 0      # disabled — overlay holds large stock position, daily % swings are normal
  max_daily_loss_pct: 0            # disabled — stock-only moves would trigger this without any option activity

cases:
